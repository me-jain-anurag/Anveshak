[project]
name = "anveshak"
version = "0.1.0"
description = "Evidence-first attribution of crypto wallets to the nearest VASP, for LEA workflows on the Sahyog portal (SIH 2026 PS 26182)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
anveshak = "anveshak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anveshak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
