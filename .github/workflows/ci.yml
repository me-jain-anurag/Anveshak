name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: "Tests (no network: every adapter test uses captured response shapes)"
        run: pytest -q
      - name: Synthetic demo runs end to end
        run: anveshak demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t anveshak:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name anveshak -p 8000:8000 -e ANVESHAK_EMBEDDED_WORKERS=0 -e ANVESHAK_MONITOR_INTERVAL=0 anveshak:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health; then exit 0; fi
            sleep 2
          done
          docker logs anveshak
          exit 1