# Verified asset registry (ADR-0007).
#
# A token is identified by (chain, contract) — never by its symbol, which anyone can copy
# ("fake USDT" contracts are a common scam tool). Only tokens listed here are marked
# `verified` and followed by the tracer by default.
#
# Every entry cites where the contract address and decimals were checked. Entries were
# verified on 2026-09-30 against CoinGecko's coin API (`detail_platforms`).
# To add an entry: verify the contract on the issuer's own page AND an independent source,
# then add both links below. Do not add entries from memory.
#
# min_amount: dust threshold in base units. Transfers below it are not followed (reported
# as excluded in the coverage section, never silently dropped).

native:
  bitcoin:  {min_amount: 10000}                 # 0.0001 BTC
  ethereum: {min_amount: 1000000000000000}      # 0.001 ETH
  bsc:      {min_amount: 1000000000000000}      # 0.001 BNB
  polygon:  {min_amount: 1000000000000000000}   # 1 POL
  tron:     {min_amount: 1000000}               # 1 TRX

tokens:
